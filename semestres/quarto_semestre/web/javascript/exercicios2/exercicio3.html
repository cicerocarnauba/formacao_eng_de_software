<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        font-family: Arial, Helvetica, sans-serif;
        display: flex;
        /* justify-content: center; */
        align-items: center;
        height: 100vh;
        flex-direction: column;
    }
    li{
        list-style-type: none;
        text-align: center;
    }

</style>

<body>
    <h1>Lista de Alunos</h1>
    <ul>
        <li>Cícero</li>
        <li>João</li>
        <li>Luís</li>
        <li>Layssa</li>
        <li>Lucca</li>
        <li>Pâmela</li>
    </ul>
</body>

<script>
    const alunos = document.querySelectorAll("ul li");
    console.log(alunos);
    for (let i = 0; i < alunos.length; i++) {
        if (i%2==0){
            alunos[i].style.color="red";
        }
    }
</script>
</html>
